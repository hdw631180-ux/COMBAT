<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Legends</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--go:#f5c451}*{box-sizing:border-box}
body{margin:0;background:#000;color:#e8e2f5;font:600 16px Rajdhani,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;user-select:none}
#g{position:relative;width:min(100vw,177vh);aspect-ratio:16/9;overflow:hidden;background:#000;font-size:clamp(11px,1.65vw,17px)}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;background:linear-gradient(90deg,#07050ff2 0,#07050fd0 40%,#07050f40 100%);animation:fi .4s}
@keyframes fi{from{opacity:0}}
#nv{width:25%;padding:4% 1% 2% 3%;display:flex;flex-direction:column;gap:.4em}
#nv h1{font:900 2.5em/1 Cinzel,Georgia,serif;margin:0 0 .6em;color:#f4eaff;letter-spacing:.05em;text-shadow:0 0 .6em #9b5cff,0 .05em 0 #000;animation:gl 3s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 1.2em #c9a2ff,0 .05em 0 #000}}
.nb{font:700 1.15em Rajdhani,sans-serif;letter-spacing:.08em;text-align:left;color:#cbbfe6;background:#ffffff0d;border:0;border-left:.25em solid transparent;padding:.5em .9em;cursor:pointer;clip-path:polygon(0 0,100% 0,93% 100%,0 100%);transition:.18s}
.nb:hover{transform:translateX(.5em);color:#fff;background:#ffffff1c}
.nb.on{color:#fff;border-left-color:var(--go);background:linear-gradient(90deg,#7c3aed99,#7c3aed11)}
.gd{margin-top:auto;font-size:1.3em}.go{color:var(--go)}
#ct{flex:1;overflow:auto;padding:3% 3% 3% 1%}
.ph{font:700 1.5em Cinzel,Georgia,serif;margin-bottom:.6em}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.7em}
.cd{background:#0d0820d0;border:1px solid #ffffff22;padding:.7em .9em;clip-path:polygon(0 0,calc(100% - 1em) 0,100% 1em,100% 100%,1em 100%,0 calc(100% - 1em));transition:transform .2s}
.cd:hover{transform:translateY(-.15em)}
.wn{font:700 1.2em Cinzel,Georgia,serif;margin-bottom:.15em}small{opacity:.75;font-size:.9em}
.bt{font:700 1em Rajdhani,sans-serif;letter-spacing:.05em;background:linear-gradient(#7c3aed,#4a22a0);border:0;color:#fff;padding:.4em 1.2em;margin-top:.5em;cursor:pointer;clip-path:polygon(.5em 0,100% 0,calc(100% - .5em) 100%,0 100%);transition:.15s}
.bt:hover:not(:disabled){filter:brightness(1.35);transform:translateY(-1px)}.bt:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.nodes{display:flex;gap:.8em;margin-top:.7em;position:relative;align-items:center}
.nodes:before{content:"";position:absolute;left:1em;right:1em;top:50%;height:2px;background:#fff3}
.nd{position:relative;width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--c);background:#10081f;color:#fff;font:700 1em Rajdhani,sans-serif;cursor:pointer;transition:.15s;padding:0}
.nd:hover:not(:disabled){background:var(--c);color:#000;transform:scale(1.2)}.nd:disabled{border-color:#fff3;cursor:default}
.nd.bs{width:3em;border-radius:1em;background:var(--c);color:#000}.nd.bs:disabled{background:#10081f}
.nd.cur{animation:pl 1.3s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 .8em #0000}}
.hc{display:flex;gap:.8em;align-items:center}.hc.sel{border-color:var(--go)}.pt{width:4em;height:5.3em;flex:none}
.bar{height:.5em;background:#2a1850;margin:.4em 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#e879f9)}
.op{max-width:34em}.rw{display:flex;justify-content:space-between;align-items:center;padding:.45em 0;border-bottom:1px solid #ffffff1a}
.sg{display:flex}.sg button{font:700 .95em Rajdhani,sans-serif;background:#ffffff12;color:#bbb;border:0;padding:.3em .8em;cursor:pointer}.sg button.on{background:#7c3aed;color:#fff}
input[type=range]{accent-color:#9b5cff;width:12em}
.fin{flex:1;background:#07050fcc;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.big{font:900 4em Cinzel,Georgia,serif;animation:pop .7s cubic-bezier(.2,1.7,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}
#tc{display:none}@media(pointer:coarse){#tc{display:block}}
#tc button{position:absolute;bottom:10px;width:52px;height:52px;border-radius:50%;opacity:.65;font:700 16px Rajdhani,sans-serif;touch-action:none;padding:0;background:#2a1850;border:2px solid #9b5cff;color:#fff}
#ts{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#000a;border:1px solid var(--go);padding:.4em 1.2em;display:none;z-index:9}
</style></head><body><div id=g><canvas width=960 height=540></canvas>
<div id=tc><button data-k=ArrowLeft style="left:8px">◀</button><button data-k=ArrowRight style="left:68px">▶</button><button data-k=Space style="right:8px">⤒</button><button data-k=KeyJ style="right:68px">⚔</button><button data-k=ShiftLeft style="right:128px">≫</button><button data-k=KeyK style="right:8px;bottom:70px">K</button><button data-k=KeyL style="right:68px;bottom:70px">L</button></div>
<div id=ts></div><div id=ui></div></div>
<script>
const $=s=>document.querySelector(s),X=$('canvas').getContext('2d'),R=Math.random,M=Math,UI=$('#ui');
const W=[["Forêt Oubliée","#1d3b2a","#0b1a12","#6ee7a0","Loup","Gardien de la Forêt","leaf"],
["Royaume des Dunes","#6b4420","#2a160a","#fbbf24","Scarabée","Pharaon Spectral","sand"],
["Cavernes de Cristal","#1f2b66","#0a0e2e","#60a5fa","Golem","Colosse de Cristal","dust"],
["Citadelle de Glace","#355a7e","#10202f","#bae6fd","Yéti","Reine des Neiges","snow"],
["Marais Maudit","#33471f","#0f1708","#a3e635","Crapaud","Hydre du Marais","rain"],
["Volcan Ardent","#6b2412","#240806","#fb923c","Diablotin","Seigneur de Lave","ember"],
["Cité des Nuages","#5b4a96","#1c1538","#f0abfc","Harpie","Dragon d'Orage","rain"],
["Abysse d'Ombre","#25103d","#050008","#c084fc","Spectre","Empereur de l'Ombre","ember"]];
const SH=["tri","tri","dia","tri","tri","tri","cir","dia"];
const WV={leaf:[-1,1.2,'#6ee7a0'],sand:[-9,.3,'#fde68a'],snow:[-.5,1,'#fff'],rain:[-3,10,'#99ccff'],ember:[.4,-1.5,'#fb923c'],dust:[0,.2,'#93c5fd']};
const C=[["Kael","#a855f7",0,1,1,1],["Lyra","#f472b6",300,.9,1.15,1.1],["Orion","#60a5fa",600,1.2,1,.95],["Nyx","#94a3b8",1000,.85,1.3,1.2],["Ragnar","#f87171",1500,1.5,1.1,.85],["Sylva","#4ade80",2200,1.1,1.2,1.15],["Zéphyr","#fde047",3000,.95,1.35,1.3],["Ignis","#fb923c",4200,1.3,1.4,1],["Aria","#22d3ee",5500,1.2,1.5,1.25],["Umbra","#d8b4fe",8000,1.6,1.7,1.2]];
const UP=[["Épée","Dégâts +20 %",100],["Armure","Vie +20 %",100],["Bottes","Vitesse +6 %",120],["Amulette","Critique +4 %",150]];
const SK=[["Onde de choc","K",400],["Lame spectrale","L",900]];
const DM=[["Vaincre 15 ennemis",15,150],["Gagner 200 pièces",200,200],["Terminer 2 niveaux",2,250]];
const AC=[["Premier sang",()=>S.k>=1],["Chasseur : 100 victoires",()=>S.k>=100],["Gardien de la Forêt vaincu",()=>S.pr>=5],["Voyageur : 3 mondes",()=>S.pr>=15],["Collectionneur : 3 héros",()=>S.ch.length>=3],["Fortune : 2000 pièces gagnées",()=>S.earn>=2000],["Légende : 8 mondes terminés",()=>S.pr>=40]];
let S;try{S=JSON.parse(localStorage.getItem('shadowlegends1'))}catch(e){}
S=S||{g:0,ch:[0],sel:0,up:[0,0,0,0],sk:[0,0],pr:0,k:0,earn:0,ach:[],d:{}};
S.o=Object.assign({vol:.6,mus:1,shake:1,num:1,fx:1,dif:1},S.o);const day=new Date().toISOString().slice(0,10);if(!S.d||S.d.day!==day)S.d={day,p:[0,0,0],c:[0,0,0]};
const save=()=>{try{localStorage.setItem('shadowlegends1',JSON.stringify(S))}catch(e){}};
let G=null,keys={},ac,gy=440;
function sfx(f,d=.08,ty='square'){try{ac=ac||new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=M.max(1e-4,.07*S.o.vol);o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function toast(t){let e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
function addP(i,n){S.d.p[i]+=n;if(!S.d.c[i]&&S.d.p[i]>=DM[i][1]){S.d.c[i]=1;S.g+=DM[i][2];toast(''+DM[i][0]+' : +'+DM[i][2]+' ◆')}}
function chk(){AC.forEach((a,i)=>{if(!S.ach.includes(i)&&a[1]()){S.ach.push(i);S.g+=100;toast('Succès : '+a[0]+' · +100 ◆')}})}
const stats=()=>{let c=C[S.sel],u=S.up;return{hp:M.round(100*c[3]*(1+.2*u[1])),atk:12*c[4]*(1+.2*u[0]),spd:4.2*c[5]*(1+.06*u[2]),crit:.05+.04*u[3]}};
function mk(w,x,b,fl){let m=1+w*.45+G.l*.15,h=(b?200:30)*m*S.o.dif;return{x,y:fl?gy-150:gy,vx:0,hp:h,mh:h,b,fl,w:b?62:24,ht:b?100:42,cd:60,hu:0,dmg:(b?14:6)*(1+w*.3)*S.o.dif,st:0,t:R()*9,act:0,dr:1}}
function start(n){let w=n/5|0,l=n%5,s=stats(),len=2600+l*500,E=[],N=8+l*3+w*2,wv=WV[W[w][6]];
G={hl:s.hp,cb:0,ct:0,n,w,l,len,s,E,P:[],F:[],cam:0,t:0,sh:0,pl:[],col:C[S.sel][1],ac:W[w][3],p:{x:100,y:gy,vx:0,vy:0,hp:s.hp,f:1,at:0,hu:0,iv:0,dd:0,dc:0,gr:1,cd:[0,0]}};
for(let i=0;i<N;i++)E.push(mk(w,700+i*(len-1200)/N+R()*150,0,i%3==2));
if(l==4){G.boss=mk(w,len-250,1);E.push(G.boss)}
for(let i=0;i<5+l;i++)G.pl.push({x:400+R()*(len-800),y:gy-90-R()*40,w:130+R()*80});
G.Wp=Array.from({length:70},()=>({x:R()*960,y:R()*540,s:1+R()*2,vx:wv[0]*(.6+R()*.8),vy:wv[1]*(.6+R()*.8)}));
UI.style.display='none'}
function fx(px,py,c,n,sp=4){n=M.round(n*S.o.fx);for(let i=0;i<n;i++){let a=R()*6.28,v=R()*sp;G.F.push({x:px,y:py,vx:M.cos(a)*v,vy:M.sin(a)*v-1,l:25+R()*20,m:45,c,s:2+R()*3})}}
const tx=(px,py,t,c)=>S.o.num&&G.F.push({x:px,y:py,vx:0,vy:-1,l:45,m:45,c,t});
function dmg(e,d,kb){let c=R()<G.s.crit;d*=(c?2:1)*(1+M.min(G.cb,25)*.01);G.cb++;G.ct=130;G.hs=c||e.hp<=d?4:1;e.hp-=d;e.hu=e.b?4:10;e.vx=kb*(e.b?.3:1);tx(e.x,e.y-e.ht-10,M.round(d),c?'#fde047':'#fff');fx(e.x,e.y-e.ht/2,G.ac,8,5);sfx(c?600:140);G.sh=M.max(G.sh,c?6:2);if(e.hp<=0)kill(e)}
function kill(e){let g=e.b?100+G.w*40:4+G.w*3;S.g+=g;S.earn+=g;S.k++;addP(0,1);addP(1,g);fx(e.x,e.y-e.ht/2,G.ac,e.b?60:24,e.b?10:6);fx(e.x,e.y-e.ht/2,'#fde047',6,4);tx(e.x,e.y-e.ht-30,'+'+g+' ◆','#fde047');sfx(80,.25,'sawtooth');if(e.b){G.sh=40;G.fl=14}chk()}
function hit(){let p=G.p;for(let e of G.E)if(e.hp>0&&(e.x-p.x)*p.f>-20&&M.abs(e.x-p.x)<90+e.w&&M.abs(e.y-e.ht/2-(p.y-35))<e.ht/2+50)dmg(e,G.s.atk,p.f*7);fx(p.x+p.f*50,p.y-35,G.col,10,4)}
function skill(i){let p=G.p,s=G.s;if(i==0){p.cd[0]=240;for(let e of G.E)if(e.hp>0&&M.abs(e.x-p.x)<230&&M.abs(e.y-p.y)<150)dmg(e,s.atk*2.2,(e.x>p.x?1:-1)*12);G.F.push({x:p.x,y:p.y-30,rg:1,l:25,m:25,c:G.col});fx(p.x,p.y-20,G.col,30,8);G.sh=12;G.fl=8;sfx(70,.3,'sawtooth')}
else{p.cd[1]=150;G.P.push({x:p.x+p.f*30,y:p.y-40,vx:p.f*13,vy:0,e:0,d:s.atk*3,l:70,c:'#fff',h:new Set});sfx(900,.15,'sawtooth')}}
function hurtP(d){let p=G.p;p.hp-=d;G.cb=0;p.iv=50;p.hu=14;p.vy=-6;G.sh=10;fx(p.x,p.y-35,'#f43f5e',12,5);sfx(110,.15,'sawtooth');if(p.hp<=0){G.ot=0;sfx(60,.5,'sawtooth')}}
function end(w){let n=G.n,r=0;if(w){r=50+n*6+(G.l==4?200:0);S.g+=r;S.earn+=r;addP(1,r);addP(2,1);if(S.pr==n)S.pr++}chk();save();G.end=1;
UI.style.display='flex';UI.innerHTML=`<div class=fin><div class=big style="color:${w?'#f5c451':'#ff5a76'}">${w?'VICTOIRE':'DÉFAITE'}</div><p>${w?'Récompense : <span class=go>◆ '+r+'</span>':'Les ombres vous ont vaincu. Passez par la Forge pour renforcer votre héros.'}</p><div>`+(w&&n<39?`<button class=bt onclick="start(${n+1})">Niveau suivant</button> `:'')+`<button class=bt onclick="start(${n})">Rejouer</button> <button class=bt onclick="menu(0)">Menu</button></div></div>`}
function upd(){if(!G||G.pause)return;if(G.hs>0){G.hs--;return}let p=G.p,s=G.s,k=keys,E=G.E;G.t++;if(G.sh>0)G.sh--;if(G.ct>0&&--G.ct==0)G.cb=0;G.hl+=(p.hp-G.hl)*.05;
if(G.demo){G.cam+=3;p.x=G.cam+700;if(G.t%1100==0)demo((G.w+1)%8)}else if(p.hp>0&&!G.done){let mv=(k.ArrowRight||k.KeyD?1:0)-(k.ArrowLeft||k.KeyA?1:0);
if(p.dd>0){p.dd--;p.vx=p.f*15;p.iv=3;G.F.push({x:p.x,y:p.y-35,vx:0,vy:0,l:12,m:12,c:G.col,s:16})}else{p.vx=mv*s.spd*(p.at>0?.6:1);if(mv)p.f=mv}
if(p.dc>0)p.dc--;
if((k.ShiftLeft||k.ShiftRight)&&!p.dd&&!p.dc){p.dd=9;p.dc=45;sfx(300,.1,'sawtooth');fx(p.x,p.y-30,'#fff',10,5)}
if((k.Space||k.ArrowUp||k.KeyW)&&p.gr){p.vy=-14.5;p.gr=0;sfx(520,.1);fx(p.x,p.y,'#fff',6,3)}
if(k.KeyJ&&p.at<=0){p.at=18;sfx(200,.08,'sawtooth')}
if(p.at>0){p.at--;if(p.at==11)hit()}
for(let i=0;i<2;i++){if(p.cd[i]>0)p.cd[i]--;if(S.sk[i]&&k[i?'KeyL':'KeyK']&&!p.cd[i])skill(i)}
let pg=p.gr;p.vy+=.75;p.x=M.max(20,M.min(G.len-20,p.x+p.vx));p.y+=p.vy;p.gr=0;
if(p.y>=gy){p.y=gy;p.vy=0;p.gr=1}
for(let q of G.pl)if(p.vy>=0&&M.abs(p.x-q.x-q.w/2)<q.w/2+8&&p.y>=q.y&&p.y-p.vy<=q.y+4){p.y=q.y;p.vy=0;p.gr=1}
if(p.gr&&!pg){fx(p.x,p.y,'#d9cfe8',8,3);sfx(90,.06)}if(p.iv>0)p.iv--;if(p.hu>0)p.hu--}
if(p.hp<=0){G.ot=(G.ot||0)+1;if(G.ot==110)end(0)}
if(!G.demo&&!G.done&&p.hp>0&&E.every(e=>e.hp<=0)){G.done=1;G.dt=0;sfx(660,.4,'triangle')}
if(G.done){G.dt++;if(G.dt==140)end(1)}
for(let e of E){if(e.hp<=0)continue;e.t+=.12;let d=p.x-e.x,ad=M.abs(d);if(!e.act&&ad>780)continue;if(!e.act&&e.b){G.sh=30;G.fl=10;sfx(60,.5,'sawtooth')}e.act=1;
if(e.hu>0){e.hu--;e.x+=e.vx;e.vx*=.85}
else if(p.hp>0&&!G.done){let sp=e.b?(e.st==1?8:e.st==2?0:1.5):1.3+G.w*.1+(e.fl?.4:0);
if(e.b&&--e.cd<=0){e.st=(e.st+1)%3;e.cd=[100,34,50][e.st];e.dr=M.sign(d)||1;if(e.st==2){for(let i=-1;i<2;i++)G.P.push({x:e.x,y:e.y-60,vx:e.dr*5,vy:i*2.2,e:1,d:e.dmg*.8,l:120,c:G.ac});sfx(120,.2,'sawtooth')}}
if(e.st==1)e.x+=e.dr*sp;else if(ad>(e.b?60:30))e.x+=M.sign(d)*sp;
if(e.fl)e.y+=((ad<300?p.y-45:gy-170)+M.sin(e.t)*25-e.y)*.04;
if(ad<e.w+14&&M.abs(e.y-p.y)<e.ht&&p.iv<=0)hurtP(e.dmg)}
e.x=M.max(0,M.min(G.len,e.x))}
for(let q of G.P){q.x+=q.vx;q.y+=q.vy;q.l--;if(R()<.5)G.F.push({x:q.x,y:q.y,vx:0,vy:0,l:12,m:12,c:q.c,s:3});
if(q.e){if(M.abs(q.x-p.x)<22&&M.abs(q.y-(p.y-35))<40&&p.iv<=0&&p.hp>0){hurtP(q.d);q.l=0}}
else for(let e of E)if(e.hp>0&&!q.h.has(e)&&M.abs(q.x-e.x)<e.w+10&&M.abs(q.y-(e.y-e.ht/2))<e.ht/2+20){q.h.add(e);dmg(e,q.d,5)}}
G.P=G.P.filter(q=>q.l>0);
for(let q of G.F){q.x+=q.vx;q.y+=q.vy;if(!q.t&&!q.rg)q.vy+=.1;q.l--}G.F=G.F.filter(q=>q.l>0);
for(let q of G.Wp){q.x+=q.vx;q.y+=q.vy;if(q.y>545)q.y=-5;if(q.y<-5)q.y=545;if(q.x<-5)q.x=965;if(q.x>965)q.x=-5}
if(!G.demo)G.cam+=(M.max(0,M.min(G.len-960,p.x-400))-G.cam)*.1}
function hills(sc,col,h,amp,fr,o,al){X.globalAlpha=al;X.fillStyle=col;X.beginPath();X.moveTo(0,540);for(let i=0;i<=960;i+=20){let wx=i+G.cam*sc;X.lineTo(i,540-h-M.sin(wx*fr+o)*amp-M.sin(wx*fr*2.3)*amp*.4)}X.lineTo(960,540);X.fill();X.globalAlpha=1}
function decor(w,cw){let ty=SH[w];X.lineWidth=2;for(let i=0;i<9;i++){let px=((i*190-G.cam*.4)%1710+1710)%1710-200,sz=50+(i*37%5)*18;X.fillStyle=cw[2];X.strokeStyle=cw[3];X.globalAlpha=.85;X.beginPath();
if(ty=="tri"){if(w==0)X.fillRect(px-5,440-sz*.5,10,sz*.5);X.moveTo(px-sz*.45,460);X.lineTo(px,460-sz*2);X.lineTo(px+sz*.45,460)}
else if(ty=="dia"){X.moveTo(px,470);X.lineTo(px+sz*.3,470-sz);X.lineTo(px,470-sz*2);X.lineTo(px-sz*.3,470-sz)}
else{let cy=300+(i*53%4)*40;X.arc(px,cy,sz*.5,0,7);X.arc(px+sz*.5,cy+8,sz*.4,0,7);X.arc(px-sz*.5,cy+8,sz*.4,0,7)}
X.fill();X.globalAlpha=.35;X.stroke();X.globalAlpha=1}}
function hero(p,t){let px=p.x-G.cam,vic=G.done,dead=p.hp<=0,run=p.gr&&M.abs(p.vx)>.5,ph=t*.35,col=G.col;
